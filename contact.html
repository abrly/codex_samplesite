<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <style>
    :root {
      --bg: #071024;
      --bg-soft: #0f1b34;
      --card: #132447;
      --text: #eaf2ff;
      --muted: #b3c2e0;
      --accent: #59b6ff;
      --accent-2: #6ef3cd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #123169 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
    }

    header {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(7, 16, 36, 0.9);
      backdrop-filter: blur(6px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent-2);
    }

    .home-link {
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      font-weight: 700;
    }

    main {
      padding: 3.5rem 0;
    }

    .card {
      background: linear-gradient(160deg, rgba(110, 243, 205, 0.17), rgba(89, 182, 255, 0.16));
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin-bottom: 0.6rem;
    }

    .intro {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .contact-list {
      list-style: none;
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .contact-list li {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.85rem 1rem;
    }

    .contact-list strong {
      color: var(--accent-2);
    }

    .back-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="container topbar">
      <div class="brand">W3 <span>Cloud Studio</span></div>
      <a class="home-link" href="index.html">Home</a>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1>Contact Us</h1>
      <p class="intro">We'd love to hear from you. Reach us using the details below:</p>

      <ul class="contact-list">
        <li><strong>Email:</strong> contact@samplesite.com</li>
        <li><strong>Phone:</strong> +1 (555) 123-4567</li>
        <li><strong>Address:</strong> 123 Main Street, Springfield, USA</li>
        <li><strong>Working Hours:</strong> Monday - Friday, 9:00 AM - 6:00 PM</li>
      </ul>

      <a class="back-link" href="index.html">Back to Home</a>
    </section>
  </main>
</body>
</html>
